version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    groups:
      react-native:
        patterns:
          - "@react-native/*"
          - "react-native"
      react:
        patterns:
          - "react"

  - package-ecosystem: "bun"
    directories:
      - "/docs/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - "react*"

  - package-ecosystem: "gradle"
    directories:
      - "/packages/react-native-nitro-modules/android/"
      - "/packages/template/android/"
      - "/tests/react-native/packages/react-native-nitro-test/android/"
      - "/tests/react-native/packages/react-native-nitro-test-external/android/"
      - "/tests/react-native/apps/example/android/"
      - "/tests/react-native/apps/benchmark/android/"
      - "/tests/standalone/runtime/android/"
      - "/tests/standalone/hermes/android/"
      - "/tests/standalone/nitro-core/android/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "kotlin"
    groups:
      agp:
        patterns:
          - "com.android.tools.build:gradle"
