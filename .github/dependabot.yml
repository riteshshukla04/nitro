version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    groups:
      react-native:
        patterns:
          - "@react-native/*"
          - "react-native"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-native-cli:
        patterns:
          - "@react-native-community/cli*"
      react-native-harness:
        patterns:
          - "react-native-harness"
          - "@react-native-harness/*"
      babel:
        patterns:
          - "@babel/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
      jest:
        patterns:
          - "jest"
          - "jest-*"
          - "@jest/*"
          - "@types/jest"
          - "babel-jest"
      docusaurus:
        patterns:
          - "@docusaurus/*"

  - package-ecosystem: "gradle"
    directories:
      - "/packages/react-native-nitro-modules/android/"
      - "/packages/template/android/"
      - "/tests/react-native/packages/react-native-nitro-test/android/"
      - "/tests/react-native/packages/react-native-nitro-test-external/android/"
      - "/tests/react-native/apps/example/android/"
      - "/tests/react-native/apps/benchmark/android/"
      - "/tests/standalone/runtime/android/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "kotlin"
    groups:
      agp:
        patterns:
          - "com.android.tools.build:gradle"
      dependencies:
        group-by: dependency-name
        patterns:
          - "*"
