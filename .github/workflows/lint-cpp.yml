name: Check C++ formatting

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  pull_request:
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.cc'
      - '**/*.hh'
      - '**/*.cpp'
      - '**/*.hpp'
      - '**/*.cxx'
      - '**/*.hxx'
      - '**/*.m'
      - '**/*.mm'
      - '.github/workflows/lint-cpp.yml'
      - 'config/.clang-format'
      - 'scripts/clang-format.sh'
      - 'scripts/format-files.sh'
      - 'package.json'
      - '.gitignore'
      - '!**/node_modules/**'
      - '!**/.build/**'
      - '!**/.harness/**'
      - '!**/build/**'
      - '!**/dist/**'
      - '!**/lib/**'
      - '!**/Pods/**'
      - '!**/vendor/**'
      - '!tests/standalone/hermes/hermes/**'
      - '!**/nitrogen/generated/**'

permissions:
  contents: read

jobs:
  lint:
    name: Format C++ and Objective-C
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==16.0.6
      - run: bun format:cpp --check
