name: Check Kotlin formatting

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  pull_request:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.github/workflows/lint-kotlin.yml'
      - '.editorconfig'
      - 'scripts/kotlin-format.sh'
      - 'scripts/format-files.sh'
      - 'package.json'
      - '.gitignore'
      - '!**/node_modules/**'
      - '!**/.build/**'
      - '!**/.harness/**'
      - '!**/build/**'
      - '!**/dist/**'
      - '!**/lib/**'
      - '!**/Pods/**'
      - '!**/vendor/**'
      - '!tests/standalone/hermes/hermes/**'
      - '!**/nitrogen/generated/**'

permissions:
  contents: read

jobs:
  lint:
    name: Format Kotlin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install ktlint
        run: |
          mkdir -p "$RUNNER_TEMP/ktlint"
          curl --fail --location --retry 3 \
            https://github.com/ktlint/ktlint/releases/download/1.8.0/ktlint \
            --output "$RUNNER_TEMP/ktlint/ktlint"
          echo "a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75  $RUNNER_TEMP/ktlint/ktlint" | sha256sum --check
          chmod +x "$RUNNER_TEMP/ktlint/ktlint"
          echo "$RUNNER_TEMP/ktlint" >> "$GITHUB_PATH"
      - run: bun format:kotlin --check
