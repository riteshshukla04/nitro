name: Check standalone test fixtures

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-runtime-js.yml"
      - "packages/nitro-core/**"
      - "packages/nitrogen/**"
      - "tests/standalone/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "scripts/releases/**"
      - "config/**"
      - "scripts/set-version.mjs"
  pull_request:
    paths:
      - ".github/workflows/test-runtime-js.yml"
      - "packages/nitro-core/**"
      - "packages/nitrogen/**"
      - "tests/standalone/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "scripts/releases/**"
      - "config/**"
      - "scripts/set-version.mjs"

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun test:prepare
      - name: Verify generated bindings are committed
        run: |
          git diff --exit-code -- tests/standalone/runtime/nitrogen/generated
          test -z "$(git ls-files --others --exclude-standard tests/standalone/runtime/nitrogen/generated)"
