name: Check release tooling

on:
  push:
    branches: [main]
    paths:
      [
        'scripts/releases/**',
        'scripts/release.sh',
        'scripts/set-version.mjs',
        'scripts/sync-core*.mjs',
        'scripts/core-package.mjs',
        'package.json',
        'bun.lock',
        'packages/**/package.json',
        'tests/react-native/**/package.json',
        'packages/nitro-core/js/src/version.ts',
        'packages/nitro-core/native/cpp/utils/NitroDefines.hpp',
        '.github/workflows/*release.yml',
      ]
  pull_request:
    paths:
      [
        'scripts/releases/**',
        'scripts/release.sh',
        'scripts/set-version.mjs',
        'scripts/sync-core*.mjs',
        'scripts/core-package.mjs',
        'package.json',
        'bun.lock',
        'packages/**/package.json',
        'tests/react-native/**/package.json',
        'packages/nitro-core/js/src/version.ts',
        'packages/nitro-core/native/cpp/utils/NitroDefines.hpp',
        '.github/workflows/*release.yml',
      ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/releases/*.test.mjs scripts/sync-core.test.mjs
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          # queue:max is supported by GitHub; actionlint 1.7.12 predates it.
          args: -color -ignore unexpected.key..queue..for..concurrency..section .github/workflows/release.yml .github/workflows/check-release.yml
