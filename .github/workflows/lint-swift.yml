name: Check Swift formatting

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  pull_request:
    paths:
      - '**/*.swift'
      - '.github/workflows/lint-swift.yml'
      - '.swift-format'
      - 'scripts/swift-format.sh'
      - 'scripts/format-files.sh'
      - 'package.json'
      - '.gitignore'
      - '!**/node_modules/**'
      - '!**/.build/**'
      - '!**/.harness/**'
      - '!**/build/**'
      - '!**/dist/**'
      - '!**/lib/**'
      - '!**/Pods/**'
      - '!**/vendor/**'
      - '!tests/standalone/hermes/hermes/**'
      - '!**/nitrogen/generated/**'

permissions:
  contents: read

jobs:
  lint:
    name: Format Swift
    runs-on: ubuntu-24.04
    container: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun format:swift --check
