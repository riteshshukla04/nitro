name: Harness iOS

concurrency:
  group: harness-ios-${{ inputs.ref && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
  workflow_dispatch:
    inputs:
      device_model:
        description: 'iOS Simulator device model'
        required: false
        default: 'iPhone 18 Pro'
        type: string
      ios_version:
        description: 'iOS version'
        required: false
        default: '27.0'
        type: string
      xcode_version:
        description: 'Xcode version, or default for the selected Xcode'
        required: false
        default: '27.1'
        type: string
  pull_request:
    paths:
      - '.github/workflows/harness-ios.yml'
      - 'Package.swift'
      - 'Package.resolved'
      - 'packages/nitro-core/**'
      - 'packages/nitrogen/**'
      - 'packages/react-native-nitro-modules/**'
      - 'tests/react-native/**'
      - 'patches/@react-native-harness%2Fplatform-apple@*.patch'
      - 'scripts/sync-core.mjs'
      - 'scripts/core-package.mjs'
      - 'scripts/set-version.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'scripts/releases/**'
      - 'config/**'

env:
  # Device configuration - can be overridden by workflow_dispatch inputs
  DEVICE_MODEL: ${{ github.event.inputs.device_model || 'iPhone 18 Pro' }}
  IOS_VERSION: ${{ github.event.inputs.ios_version || '27.0' }}
  XCODE_VERSION: ${{ github.event.inputs.xcode_version || '27.1' }}
  HARNESS_DEBUG: 1

jobs:
  harness_ios_new:
    name: Harness iOS
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Select Xcode
        run: |
          if [ "$XCODE_VERSION" = "default" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          fi
          xcodebuild -version
          xcrun swift --version

      - name: Install npm dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Check Harness app detection
        run: bun test tests/react-native/apps/example/harness-apple.test.mjs

      - name: Generate test bindings
        run: bun specs

      - name: Install Ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          max-size: 1.5G
          key: ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-Default-ccache-example-ios
      - name: Setup ccache behavior
        run: |
          {
            echo "CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros"
            echo "CCACHE_FILECLONE=true"
            echo "CCACHE_DEPEND=true"
            echo "CCACHE_INODECACHE=true"
          } >> "$GITHUB_ENV"

      - name: Resolve Swift packages
        working-directory: tests/react-native/apps/example
        run: bun spm

      # `**` globs walked node_modules: computing the key took up to two
      # minutes and once exceeded hashFiles' 120-second limit in the post step.
      # bun.lock already covers dependencies, so only the repository's own
      # Swift package files are hashed.
      - name: Restore DerivedData cache
        uses: actions/cache@v6
        with:
          path: tests/react-native/apps/example/ios/build
          key:
            ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-Default-dd-${{ hashFiles('bun.lock', 'Package.swift',
            'Package.resolved', 'packages/*/Package.swift', 'tests/react-native/packages/*/Package.swift',
            'tests/react-native/apps/*/ios/*.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved',
            'tests/standalone/hermes/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode${{ env.XCODE_VERSION }}-Default-dd-

      - name: Build React Native iOS app
        working-directory: tests/react-native/apps/example/ios
        run: |
          set -o pipefail
          xcodebuild \
            C_COMPILER_LAUNCHER="$(command -v ccache)" \
            CLANG_ENABLE_EXPLICIT_MODULES_WITH_COMPILER_LAUNCHER=YES \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -project NitroExample.xcodeproj \
            -scheme NitroExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -showBuildTimingSummary \
            ARCHS=arm64 \
            build \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

      - name: Install Watchman
        run: brew install watchman

      # A fresh simulator spends minutes migrating data on its first boot. Boot
      # it outside Harness, whose 420-second startup budget should only cover
      # launching the app. The boot runs on its own: overlapping it with the
      # app build or with installing Watchman slowed those steps several times
      # over on 3-core runners.
      - name: Boot the simulator
        id: simulator-boot
        timeout-minutes: 10
        run: |
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}"
          udid=$(xcrun simctl list devices available --json |
            jq -r --arg runtime "$runtime" --arg model "$DEVICE_MODEL" \
              '.devices[$runtime] // [] | map(select(.name == $model)) | first | .udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No available $DEVICE_MODEL simulator with iOS $IOS_VERSION"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          echo "Booting $DEVICE_MODEL (iOS $IOS_VERSION, $udid) at $(date -u +%T)"
          xcrun simctl bootstatus "$udid" -b
          echo "Booted at $(date -u +%T)"

      - name: Collect simulator boot diagnostics
        if: failure() && steps.simulator-boot.outcome == 'failure'
        run: |
          xcrun simctl list devices
          xcrun simctl diagnose --udid="$SIMULATOR_UDID" --no-archive --output="$RUNNER_TEMP/simulator-diagnostics" -b < /dev/null || true

      - name: Upload simulator boot diagnostics
        if: failure() && steps.simulator-boot.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: harness-ios-simulator-diagnostics
          path: ${{ runner.temp }}/simulator-diagnostics
          if-no-files-found: ignore

      - name: Run Harness E2E tests
        uses: callstackincubator/react-native-harness@v1.5.0
        with:
          runner: ios
          projectRoot: tests/react-native/apps/example
          app: ios/build/Build/Products/Debug-iphonesimulator/NitroExample.app
          packageManager: bun
          # The default only saves Metro and the simulator agent from the
          # default branch, so pull requests always started both cold.
          cacheSavePolicy: always

      - name: Print native crash reports
        if: failure()
        working-directory: tests/react-native/apps/example
        shell: bash
        run: |
          # Harness only extracts crash logs it classifies as native crashes,
          # so also print the simulator's own crash reports.
          {
            [ -d .harness/crash-reports ] && find .harness/crash-reports -type f
            find ~/Library/Logs/DiagnosticReports -name 'NitroExample*.ips' 2>/dev/null
          } | sort | while read -r report; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done
